<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTIONS — Private Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1.5rem;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Fullscreen dark background image */
        background: url('scalp-main.jpg') center/cover no-repeat fixed;
        font-family: 'Inter', sans-serif;
        color: #ffffff;
        position: relative;
      }

      /* Dark veil over the main body background */
      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.75);
        z-index: 1;
      }

      /* Floating Split-Card Container */
      .pass-card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 820px;
        display: flex;
        background-color: #0d0d0d;
        border: 1px solid #1a1a1a;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      }

      /* Left Side: Featured Image */
      .card-image-side {
        flex: 1.1;
        background: url('scalp-main.jpg') center/cover no-repeat;
        min-height: 480px;
      }

      /* Right Side: Form Panel */
      .card-form-side {
        flex: 1;
        padding: 3rem 2.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background-color: #0b0b0b;
      }

      /* Logo */
      .logo-container {
        width: 100%;
        max-width: 140px;
        margin-bottom: 1.5rem;
      }

      .brand-logo {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      /* Subtitle / Tagline */
      .brand-sub {
        font-size: 0.7rem;
        color: var(--accent-orange, #ff832a);
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 1.75rem;
      }

      /* Form Elements */
      .pass-form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .pass-input {
        width: 100%;
        padding: 0.9rem 1rem;
        background: #181818;
        border: 1px solid #282828;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        font-weight: 500;
        text-align: center;
        letter-spacing: 0.5px;
        outline: none;
        transition: border-color 0.2s ease;
      }

      .pass-input:focus {
        border-color: #444444;
      }

      .pass-input::placeholder {
        color: #666666;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 1px;
      }

      .pass-btn {
        width: 100%;
        padding: 0.9rem 1rem;
        background: #ffffff;
        color: #000000;
        border: none;
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 1.5px;
        cursor: pointer;
        text-transform: uppercase;
        transition: opacity 0.2s ease, background-color 0.2s ease;
      }

      .pass-btn:hover {
        opacity: 0.9;
      }

      /* Outline Alternate Button */
      .pass-btn.alt {
        background: transparent;
        color: #ffffff;
        border: 1px solid #282828;
      }

      .pass-btn.alt:hover {
        border-color: #555555;
        background: #121212;
      }

      /* Divider Line */
      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        width: 100%;
        margin: 1.25rem 0;
        color: #444444;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #1e1e1e;
      }

      .divider span {
        padding: 0 0.75rem;
      }

      .error-msg {
        color: #ff4d4d;
        font-size: 0.75rem;
        margin: 0;
        display: none;
        font-weight: 600;
      }

      /* Mobile Responsiveness */
      @media (max-width: 720px) {
        .pass-card {
          flex-direction: column;
          max-width: 400px;
        }

        .card-image-side {
          min-height: 220px;
        }

        .card-form-side {
          padding: 2rem 1.5rem;
        }
      }
    </style>
</head>
<body>

    <div class="pass-card">
      
      <!-- LEFT PANEL: IMAGE -->
      <div class="card-image-side"></div>

      <!-- RIGHT PANEL: FORM CONTENT -->
      <div class="card-form-side">
        
        <!-- Logo -->
        <div class="logo-container">
          <img src="potions-logo.png" alt="POTIONS Logo" class="brand-logo">
        </div>

        <p class="brand-sub">- sign up for password upon release -</p>

        <!-- MODE 1: WAITLIST FORM -->
        <div id="waitlist-mode" style="width: 100%;">
          <form action="YOUR_GOOGLE_FORM_URL_HERE" method="POST" target="_blank" class="pass-form">
            <input type="email" name="entry.YOUR_ENTRY_ID" placeholder="EMAIL ADDRESS" required class="pass-input">
            <button type="submit" class="pass-btn">JOIN WAITLIST</button>
          </form>

          <div class="divider"><span>OR</span></div>

          <button type="button" id="btn-show-pass" class="pass-btn alt">ENTER PASSWORD</button>
        </div>

        <!-- MODE 2: PASSWORD ACCESS FORM -->
        <div id="password-mode" style="display: none; width: 100%;">
          <form id="pass-form" class="pass-form">
            <input type="password" id="pass-input" placeholder="ENTER PASSWORD" required class="pass-input">
            <p id="pass-error" class="error-msg">INVALID PASSWORD</p>
            <button type="submit" class="pass-btn">ENTER SITE</button>
          </form>

          <div class="divider"><span>OR</span></div>

          <button type="button" id="btn-show-waitlist" class="pass-btn alt">BACK TO WAITLIST</button>
        </div>

      </div>

    </div>

    <script>
      const SITE_PASSWORD = "POTIONS2026";

      const waitlistMode = document.getElementById('waitlist-mode');
      const passMode     = document.getElementById('password-mode');
      const btnShowPass  = document.getElementById('btn-show-pass');
      const btnShowWait  = document.getElementById('btn-show-waitlist');
      const passForm     = document.getElementById('pass-form');
      const passInput    = document.getElementById('pass-input');
      const passError    = document.getElementById('pass-error');

      btnShowPass.addEventListener('click', () => {
        waitlistMode.style.display = 'none';
        passMode.style.display = 'block';
      });

      btnShowWait.addEventListener('click', () => {
        passMode.style.display = 'none';
        waitlistMode.style.display = 'block';
      });

      passForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (passInput.value === SITE_PASSWORD) {
          sessionStorage.setItem('siteUnlocked', 'true');
          window.location.href = 'index.html';
        } else {
          passError.style.display = 'block';
        }
      });
    </script>
</body>
</html>
