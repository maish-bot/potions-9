<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTIONS — Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600;700;900&family=Syne:wght@800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        font-family: 'Courier Prime', monospace, sans-serif;
        color: #ffffff;
      }

      .pass-container {
        width: 100%;
        max-width: 520px;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      /* Expanded Logo Container - No Frame */
      .logo-container {
        width: 100%;
        max-width: 380px;
        margin-bottom: 2.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .brand-logo {
        width: 100%;
        height: auto;
        max-height: 220px;
        object-fit: contain;
      }

      /* Form Container */
      .pass-form-wrapper {
        width: 100%;
        max-width: 380px;
      }

      /* Integrated Split Input/Button Group */
      .split-input-group {
        display: flex;
        width: 100%;
        background-color: var(--accent-orange, #ff832a);
        padding: 3px;
        box-sizing: border-box;
      }

      .split-input {
        flex: 1;
        background: var(--accent-orange, #ff832a);
        border: none;
        color: #000000;
        padding: 0.85rem 1rem;
        font-family: 'Courier Prime', monospace;
        font-size: 0.95rem;
        font-weight: 700;
        outline: none;
      }

      .split-input::placeholder {
        color: rgba(0, 0, 0, 0.7);
        font-weight: 400;
      }

      .split-btn {
        background: #000000;
        color: #ffffff;
        border: none;
        padding: 0 1.25rem;
        font-family: 'Courier Prime', monospace;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        cursor: pointer;
        text-transform: uppercase;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .split-btn:hover {
        background: #ffffff;
        color: #000000;
      }

      /* Mode Toggle Button */
      .toggle-mode-btn {
        background: transparent;
        border: none;
        color: var(--accent-orange, #ff832a);
        font-family: 'Courier Prime', monospace;
        font-size: 0.85rem;
        margin-top: 2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .toggle-mode-btn:hover {
        text-decoration: underline;
      }

      .lock-icon {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      /* Subtitle / Tagline */
      .brand-sub {
        font-size: 0.85rem;
        color: var(--accent-orange, #ff832a);
        margin-top: 3.5rem;
        letter-spacing: 0.5px;
        font-family: 'Courier Prime', monospace;
      }

      .error-msg {
        color: #ff4d4d;
        font-size: 0.75rem;
        margin-top: 0.5rem;
        display: none;
        font-family: 'Courier Prime', monospace;
      }

      @media (max-width: 480px) {
        .logo-container {
          max-width: 280px;
        }
        .split-btn {
          padding: 0 0.85rem;
          font-size: 0.7rem;
        }
      }
    </style>
</head>
<body>

    <div class="pass-container">
      
      <!-- Frameless, Enlarged Brand Logo -->
      <div class="logo-container">
        <img src="potions-logo.png" alt="POTIONS Logo" class="brand-logo">
      </div>

      <div class="pass-form-wrapper">
        
        <!-- MODE 1: EMAIL WAITLIST FORM -->
        <div id="waitlist-mode">
          <form action="YOUR_GOOGLE_FORM_URL_HERE" method="POST" target="_blank">
            <div class="split-input-group">
              <input type="email" name="entry.YOUR_ENTRY_ID" placeholder="Email" required class="split-input">
              <button type="submit" class="split-btn">SUBMIT</button>
            </div>
          </form>

          <button type="button" id="btn-show-pass" class="toggle-mode-btn">
            <svg class="lock-icon" viewBox="0 0 24 24">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            Password
          </button>
        </div>

        <!-- MODE 2: PASSWORD ACCESS FORM -->
        <div id="password-mode" style="display: none;">
          <form id="pass-form">
            <div class="split-input-group">
              <input type="password" id="pass-input" placeholder="Password" required class="split-input">
              <button type="submit" class="split-btn">ENTER</button>
            </div>
            <p id="pass-error" class="error-msg">INVALID PASSWORD</p>
          </form>

          <button type="button" id="btn-show-waitlist" class="toggle-mode-btn">
            Back to Email Sign-up
          </button>
        </div>

      </div>

      <!-- Footer Tagline -->
      <p class="brand-sub">- sign up for password upon release -</p>

    </div>

    <script>
      const SITE_PASSWORD = "POTIONS2026";

      const waitlistMode = document.getElementById('waitlist-mode');
      const passMode     = document.getElementById('password-mode');
      const btnShowPass  = document.getElementById('btn-show-pass');
      const btnShowWait  = document.getElementById('btn-show-waitlist');
      const passForm     = document.getElementById('pass-form');
      const passInput    = document.getElementById('pass-input');
      const passError    = document.getElementById('pass-error');

      btnShowPass.addEventListener('click', () => {
        waitlistMode.style.display = 'none';
        passMode.style.display = 'block';
      });

      btnShowWait.addEventListener('click', () => {
        passMode.style.display = 'none';
        waitlistMode.style.display = 'block';
      });

      passForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (passInput.value === SITE_PASSWORD) {
          sessionStorage.setItem('siteUnlocked', 'true');
          window.location.href = 'index.html';
        } else {
          passError.style.display = 'block';
        }
      });
    </script>
</body>
</html>
