<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTIONS — Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      /* Fix 1: Set html background to pure black to eliminate white space during elastic scrolling/pull-to-refresh */
      html {
        background-color: #000000;
        height: 100%;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        padding: 1.5rem;
        min-height: 100vh;
        min-height: 100dvh; /* Dynamic viewport height to account for mobile browser bars */
        display: flex;
        align-items: center;
        justify-content: center;
        /* Full-screen dark background image fallback */
        background: #000000 url('scalp-main.jpg') center/cover no-repeat fixed;
        font-family: 'Inter', sans-serif;
        color: #ffffff;
        position: relative;
        overflow-x: hidden;
      }

      /* Fix 2: Fixed positioning for dark overlay veil so it stays pinned across full viewport during scroll */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.75);
        z-index: 1;
        pointer-events: none;
      }

      /* Floating Split-Card Container */
      .pass-card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 850px;
        margin: auto;
        display: flex;
        background-color: #000000;
        border: 1px solid #1f1f1f;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      }

      /* Left Side: Featured Image Panel */
      .card-image-side {
        flex: 1.1;
        background: url('scalp-main.jpg') center/cover no-repeat;
        min-height: 480px;
      }

      /* Right Side: Form Panel */
      .card-form-side {
        flex: 1;
        padding: 3rem 2.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        background-color: #000000;
      }

      /* Logo Container */
      .logo-container {
        width: 100%;
        max-width: 160px;
        margin-bottom: 2.5rem;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .brand-logo {
        width: 100%;
        height: auto;
        max-height: 180px;
        object-fit: contain;
      }

      /* Form Wrapper */
      .pass-form-wrapper {
        width: 100%;
      }

      /* Integrated Split Input/Button Group */
      .split-input-group {
        display: flex;
        width: 100%;
        background-color: var(--accent-orange, #ff832a);
        padding: 4px;
        align-items: center;
      }

      .split-input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        color: #000000;
        padding: 0.85rem 1rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.2;
        outline: none;
      }

      .split-input::placeholder {
        color: rgba(0, 0, 0, 0.7);
        font-weight: 500;
      }

      .split-btn {
        background: #000000;
        color: #ffffff;
        border: none;
        padding: 0.85rem 1.5rem;
        font-family: 'Syne', sans-serif;
        font-size: 0.85rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 1px;
        cursor: pointer;
        text-transform: uppercase;
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .split-btn:hover {
        background: #ffffff;
        color: #000000;
      }

      /* Mode Toggle Button */
      .toggle-mode-btn {
        background: transparent;
        border: none;
        color: var(--accent-orange, #ff832a);
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        font-weight: 600;
        margin-top: 1.5rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .toggle-mode-btn:hover {
        text-decoration: underline;
      }

      .lock-icon {
        width: 14px;
        height: 14px;
        fill: currentColor;
        flex-shrink: 0;
      }

      /* Subtitle / Tagline */
      .brand-sub {
        font-size: 0.8rem;
        color: var(--accent-orange, #ff832a);
        margin-top: 3rem;
        letter-spacing: 0.5px;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        line-height: 1.4;
      }

      .error-msg {
        color: #ff4d4d;
        font-size: 0.75rem;
        margin-top: 0.5rem;
        display: none;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
      }

      /* Responsive Layout for Mobile */
      @media (max-width: 720px) {
        body {
          padding: 1rem 0.75rem;
        }

        /* Fix 3: Standard page flow prevents cropped content and nested scrollbars on mobile */
        .pass-card {
          flex-direction: column;
          max-width: 420px;
          margin: 1rem auto;
        }

        .card-image-side {
          min-height: 220px;
          flex: none;
        }

        .card-form-side {
          padding: 2rem 1.5rem;
        }

        .logo-container {
          max-width: 120px;
          margin-bottom: 1.75rem;
        }

        .split-btn {
          padding: 0.85rem 1rem;
          font-size: 0.75rem;
        }
      }
    </style>
</head>
<body>

    <div class="pass-card">
      
      <!-- LEFT SIDE: LIFESTYLE IMAGE -->
      <div class="card-image-side"></div>

      <!-- RIGHT SIDE: FORM CONTENT -->
      <div class="card-form-side">
        
        <!-- Brand Logo -->
        <div class="logo-container">
          <img src="potions-logo.png" alt="POTIONS Logo" class="brand-logo">
        </div>

        <div class="pass-form-wrapper">
          
          <!-- MODE 1: EMAIL WAITLIST FORM -->
          <div id="waitlist-mode">
            <form action="YOUR_GOOGLE_FORM_URL_HERE" method="POST" target="_blank">
              <div class="split-input-group">
                <input type="email" name="entry.YOUR_ENTRY_ID" placeholder="Email" required class="split-input">
                <button type="submit" class="split-btn">SUBMIT</button>
              </div>
            </form>

            <button type="button" id="btn-show-pass" class="toggle-mode-btn">
              <svg class="lock-icon" viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
              Password
            </button>
          </div>

          <!-- MODE 2: PASSWORD ACCESS FORM -->
          <div id="password-mode" style="display: none;">
            <form id="pass-form">
              <div class="split-input-group">
                <input type="password" id="pass-input" placeholder="Password" required class="split-input">
                <button type="submit" class="split-btn">ENTER</button>
              </div>
              <p id="pass-error" class="error-msg">INVALID PASSWORD</p>
            </form>

            <button type="button" id="btn-show-waitlist" class="toggle-mode-btn">
              Back to Email Sign-up
            </button>
          </div>

        </div>

        <!-- Footer Tagline -->
        <p class="brand-sub">- sign up for password upon release -</p>

      </div>

    </div>

    <script>
      const SITE_PASSWORD = "POTIONS2026";

      const waitlistMode = document.getElementById('waitlist-mode');
      const passMode     = document.getElementById('password-mode');
      const btnShowPass  = document.getElementById('btn-show-pass');
      const btnShowWait  = document.getElementById('btn-show-waitlist');
      const passForm     = document.getElementById('pass-form');
      const passInput    = document.getElementById('pass-input');
      const passError    = document.getElementById('pass-error');

      btnShowPass.addEventListener('click', () => {
        waitlistMode.style.display = 'none';
        passMode.style.display = 'block';
      });

      btnShowWait.addEventListener('click', () => {
        passMode.style.display = 'none';
        waitlistMode.style.display = 'block';
      });

      passForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (passInput.value === SITE_PASSWORD) {
          sessionStorage.setItem('siteUnlocked', 'true');
          window.location.href = 'index.html';
        } else {
          passError.style.display = 'block';
        }
      });
    </script>
</body>
</html>
